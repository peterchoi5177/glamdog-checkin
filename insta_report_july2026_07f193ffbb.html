*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,system-ui,sans-serif;background:#e9e4db;color:#2b2722;padding:22px 14px 60px}
.shell{max-width:880px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{border:none;background:#fff;color:#8a7a64;font-weight:700;font-size:12px;padding:8px 13px;border-radius:20px;cursor:pointer;font-family:inherit;transition:.15s}
.tab:hover{background:#f3ece1}.tab.on{background:#b08968;color:#fff}

.dlbtn:hover{background:#000}.dlbtn:disabled{opacity:.5}
#report{background:#f4f1ec;border-radius:20px;padding:30px 26px}
.cap{text-align:center;margin-bottom:24px}
.cap .k{font-size:12px;letter-spacing:3px;color:#b08968;font-weight:700}
.cap h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:6px 0 4px}
.cap .p{color:#8a8278;font-size:13px}
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}
.h{background:#fff;border-radius:15px;padding:16px 13px;box-shadow:0 2px 12px rgba(120,100,70,.06)}
.h .l{font-size:11px;color:#9a8f80;font-weight:600;margin-bottom:6px}
.h .v{font-size:24px;font-weight:800;letter-spacing:-1px}
.h.foll{background:#2b2722}.h.foll .l{color:#c9b79f}.h.foll .v{color:#fff}

.wbox{background:#fff;border-radius:16px;padding:18px 14px 8px;box-shadow:0 2px 12px rgba(120,100,70,.06)}

  if(mg)mg.innerHTML=[['week','주간'],['cum','누적']].map(m=>`<button class="wt${_wmode===m[0]?' on':''}" onclick="setWMode('${m[0]}')">${m[1]}</button>`).join('');
  tg.innerHTML=WMETRICS.map(m=>`<button class="wt${_wm===m[0]?' on':''}" onclick="setWM('${m[0]}')">${m[1]}</button>`).join('');
  box.innerHTML=weeklyChartHTML(_wmode)+'<div style="text-align:center;font-size:10px;color:#9a8f80">막대/점에 마우스를 올리면 상세</div>';
}
function sel(vid){cur=vid;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===vid));render(vid);
  detailOpen=false;var dt=document.getElementById('detail');if(dt)dt.style.display='none';var db=document.getElementById('detailbtn');if(db)db.textContent='📋 게시물별 세부사항 보기';
  window.scrollTo(0,0);}
let _sort='date',detailOpen=false;
function setSort(k){_sort=k;renderDetail();}
function renderDetail(){
  const d=DATA[cur];const el=document.getElementById('detail');
  const rows=(d.rows||[]).slice().sort((a,b)=> _sort==='date'?(a.date<b.date?1:-1):((b[_sort]||0)-(a[_sort]||0)));
  if(!rows.length){el.innerHTML='<div style="text-align:center;color:#9a8f80;padding:20px">게시물 데이터 없음</div>';return;}
  const tr=rows.map(r=>`<tr><td>${r.date}</td><td><span class="badge ${r.type==='릴스'?'reels':'feed'}">${r.type}</span></td>
    <td>${f(r.views)}</td><td>${f(r.reach)}</td><td>${f(r.likes)}</td><td class="hl">${f(r.saved)}</td><td>${f(r.comments)}</td><td class="hl">${f(r.total_interactions)}</td>
    <td>${r.link?`<a class="dlink" href="${r.link}" target="_blank">보기</a>`:'-'}</td></tr>`).join('');
  el.innerHTML=`<div class="dtitle">게시물별 인사이트 · 총 ${rows.length}건</div>
    <div class="dsorts">정렬:
      <button class="dsort${_sort==='date'?' on':''}" onclick="setSort('date')">최신순</button>
      <button class="dsort${_sort==='views'?' on':''}" onclick="setSort('views')">조회순</button>
      <button class="dsort${_sort==='saved'?' on':''}" onclick="setSort('saved')">저장순</button>
      <button class="dsort${_sort==='total_interactions'?' on':''}" onclick="setSort('total_interactions')">상호작용순</button></div>
    <table><thead><tr><th>날짜</th><th>포맷</th><th>조회</th><th>도달</th><th>좋아요</th><th>저장</th><th>댓글</th><th>상호작용</th><th>원본</th></tr></thead><tbody>${tr}</tbody></table>`;
}
function toggleDetail(){detailOpen=!detailOpen;const el=document.getElementById('detail'),b=document.getElementById('detailbtn');
  if(detailOpen){renderDetail();el.style.display='block';b.textContent='📋 세부사항 닫기';el.scrollIntoView({behavior:'smooth',block:'start'});}
  else{el.style.display='none';b.textContent='📋 게시물별 세부사항 보기';}}
async function dl(){const btn=document.getElementById('dl');const old=btn.textContent;btn.disabled=true;btn.textContent='생성 중…';
  try{const el=document.getElementById('report');
    const _box=document.getElementById('weekly'),_mg=document.getElementById('wmode');
    const _sb=_box?_box.innerHTML:null,_sm=_mg?_mg.style.display:'';
    if(_box)_box.innerHTML='<div class="wpdfh">① 주간 (그 주 실제 수치)</div>'+weeklyChartHTML('week')+'<div class="wpdfh" style="margin-top:16px">② 누적 (기간 합산 추이)</div>'+weeklyChartHTML('cum');
    if(_mg)_mg.style.display='none';
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#f4f1ec',useCORS:true});
    if(_box!=null&&_sb!=null)_box.innerHTML=_sb; if(_mg)_mg.style.display=_sm;
    const img=canvas.toDataURL('image/jpeg',0.92);const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
    const pw=210,ph=297;let w=pw,h=pw*canvas.height/canvas.width;
    if(h>ph){h=ph;w=ph*canvas.width/canvas.height;}
    pdf.addImage(img,'JPEG',(pw-w)/2,(ph-h)/2,w,h);pdf.save((NAMES[cur]||cur)+'_운영리포트.pdf');
  }catch(e){alert('PDF 생성 실패: '+e.message);}
  btn.disabled=false;btn.textContent=old;}
sel(cur);
</script></body></html>
